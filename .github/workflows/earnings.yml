name: Earnings alert

on:
  schedule:
    - cron: "0 5,10,13,18,21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: earnings-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        env:
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python earnings-bot/earnings_bot.py

      - name: Publish feed to /docs
        run: |
          mkdir -p docs
          cp earnings-bot/docs/index.html   docs/index.html
          cp earnings-bot/docs/earnings.json docs/earnings.json

      - name: Commit state + feed
        run: |
          if [[ -n "$(git status --porcelain earnings-bot/state.json docs/)" ]]; then
            git config user.name  "earnings-bot"
            git config user.email "actions@github.com"
            git add earnings-bot/state.json docs/
            git commit -m "update: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Nema promjena"
          fi
